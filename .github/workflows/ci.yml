# Builds the app for every platform it runs on and runs the tests. Nothing is
# signed: this checks the code, it doesn't make something to install.
#
# It runs on pull requests and when started by hand (Actions ▸ CI ▸ Run
# workflow). Not on every push to main: macOS minutes count ten times against
# a private repository's Actions allowance.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app needs the OS 27 SDKs, so Xcode 27 or later.
  MIN_XCODE: 27

jobs:
  apple:
    name: Build (tvOS, iOS, macOS) and test
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Choose Xcode
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | grep -v -i beta | sort -V | tail -1 | cut -d' ' -f2)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt "$MIN_XCODE" ]; then
            echo "::error::This runner's newest Xcode is $major; the app needs Xcode $MIN_XCODE or later."
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      # Swift packages (AetherEngine, swift-ass-renderer), kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('**/Package.resolved') }}

      # One step per platform, so a failure says which. AetherEngine is arm64
      # only, so each builds for arm64 (the runner is Apple silicon).
      - name: Build for tvOS
        run: ./.github/xcbuild.sh tvOS 'generic/platform=tvOS Simulator'
      - name: Build for iOS
        if: (success() || failure()) && steps.xcode.outcome == 'success'
        run: ./.github/xcbuild.sh iOS 'generic/platform=iOS Simulator'
      - name: Build for macOS
        if: (success() || failure()) && steps.xcode.outcome == 'success'
        run: ./.github/xcbuild.sh macOS 'generic/platform=macOS'

      - name: Test (on an Apple TV simulator)
        if: (success() || failure()) && steps.xcode.outcome == 'success'
        run: |
          # The newest available Apple TV simulator.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          tv = [(rt, d) for rt, ds in devs.items() if "tvOS" in rt for d in ds]
          tv.sort(key=lambda x: [int(n) for n in x[0].rsplit("tvOS-", 1)[1].split("-")])
          print(tv[-1][1]["udid"] if tv else "")')
          if [ -z "$udid" ]; then echo "::error::No Apple TV simulator on this runner."; xcrun simctl list runtimes; exit 1; fi
          set -o pipefail
          xcodebuild test \
            -project AsterFIN.xcodeproj -scheme AsterFIN \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee test.log | grep -E '(error|✘|Test run|\*\* TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' test.log

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: '*.log'
